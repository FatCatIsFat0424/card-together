# Keep legacy URLs until HTTPS so path-scoped cookies reach the migration API.
location = /card-together {
    return 308 https://acserver.csie.org$request_uri;
}
location ^~ /card-together/ {
    return 308 https://acserver.csie.org$request_uri;
}
location = /bridge_online {
    return 308 https://acserver.csie.org$request_uri;
}
location ^~ /bridge_online/ {
    return 308 https://acserver.csie.org$request_uri;
}
