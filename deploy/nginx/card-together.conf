# Include inside the existing HTTPS server block for acserver.csie.org.
location = /card-together {
    return 308 /card-together/$is_args$args;
}

location ^~ /card-together/api/ {
    # A 2 MiB background expands to about 2.67 MiB in the JSON upload.
    client_max_body_size 3m;
    proxy_pass http://127.0.0.1:3001/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    add_header X-Content-Type-Options "nosniff" always;
    # Explicit migration and cookie-expiry paths must remain intact.
    proxy_cookie_path ~^/$ /card-together/;
}

location ^~ /card-together/socket.io/ {
    proxy_pass http://127.0.0.1:3001/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 75s;
    proxy_buffering off;
}

location = /card-together/health {
    proxy_pass http://127.0.0.1:3001/health;
}

# Hashed build output never changes in place; a missing file must be a 404, not index.html.
location ^~ /card-together/assets/ {
    root /opt/card-together/www;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    # add_header in a location replaces inherited headers, so repeat the full set.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss://acserver.csie.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    gzip on;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
}

# Site emoji file names contain a content hash, so they are cached like hashed assets.
location ^~ /card-together/provided-emoji/ {
    root /opt/card-together/www;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    # add_header in a location replaces inherited headers, so repeat the full set.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss://acserver.csie.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
}

location ^~ /card-together/ {
    root /opt/card-together/www;
    try_files $uri $uri/ /card-together/index.html;
    add_header Cache-Control "no-cache";
    # add_header in a location replaces inherited headers, so repeat the full set.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss://acserver.csie.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    gzip on;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
}

# Stale clients keep their API, WebSocket, and static URLs during migration.
location ^~ /bridge_online/api/ {
    client_max_body_size 3m;
    proxy_pass http://127.0.0.1:3001/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_cookie_path ~^/$ /bridge_online/;
}

location ^~ /bridge_online/socket.io/ {
    proxy_pass http://127.0.0.1:3001/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 75s;
    proxy_buffering off;
}

location = /bridge_online/health {
    proxy_pass http://127.0.0.1:3001/health;
}

location ~ ^/bridge_online/(?:assets|audio-library|provided-music|locales)/ {
    root /opt/card-together/www;
    try_files $uri =404;
}

location ~ ^/bridge_online/(?:favicon|fatcat_icon|icons)\.svg$ {
    root /opt/card-together/www;
    try_files $uri =404;
}

location = /bridge_online {
    return 308 /card-together/$is_args$args;
}

location /bridge_online/ {
    rewrite ^/bridge_online/(.*)$ /card-together/$1 permanent;
}
