name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The owner's music and site emoji are not in the repository; the import steps run
      # against empty local-music and local-emoji directories.
      - name: Build client
        run: npm run build:client

      - name: Check deployment shell syntax
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done

      - name: Test deployment helpers
        run: python3 -B -m unittest discover -s deploy/tests
