name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A full check split in parallel jobs; the tests take the longest, so they run in two shards.
  checks:
    name: checks (${{ matrix.part }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: static
          - part: tests
            shard: 1/2
          - part: tests
            shard: 2/2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      # The owner's music, site emoji and walkthrough videos are not in the repository; the
      # import steps run against empty local-music, local-emoji and local-demos directories.
      - name: Validate the ${{ matrix.part }} part of the full check
        run: npm run check -- full --part ${{ matrix.part }} ${{ matrix.shard && format('--shard {0}', matrix.shard) || '' }}
