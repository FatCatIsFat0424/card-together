name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Matches the production host (Ubuntu 24.04) so deployment helpers run on the same system tools.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      # The owner's music, site emoji and walkthrough videos are not in the repository; the
      # import steps run against empty local-music, local-emoji and local-demos directories.
      - name: Validate all checks and build artifacts
        run: npm run check -- full
