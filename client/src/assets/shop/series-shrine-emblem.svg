<svg id="still" xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><style>svg:target *{animation:none!important}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 24s linear infinite}.pulse{animation:pulse 3.6s ease-in-out infinite}.drift{animation:drift 7s ease-in-out infinite alternate}.scan{animation:scan 6s linear infinite}.flicker{animation:pulse 2.8s ease-in-out infinite alternate}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes drift{to{transform:translate(8px,-5px)}}@keyframes scan{0%{transform:translateX(-30px);opacity:0}25%,75%{opacity:.6}100%{transform:translateX(60px);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#271421"/><stop offset="1" stop-color="#080d1a"/></linearGradient><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#ffe5a6"/><stop offset=".48" stop-color="#ff795e"/><stop offset="1" stop-color="#ffe5a6"/></linearGradient><radialGradient id="aura"><stop stop-color="#ff795e" stop-opacity=".3"/><stop offset="1" stop-color="#ff795e" stop-opacity="0"/></radialGradient></defs><g transform="translate(50 50) scale(1)"><path d="M-33-27Q0-18 33-27L30-17H-30ZM-29-9H29V-3H-29ZM-23-17H-17V32H-23ZM17-17H23V32H17Z" fill="url(#metal)" stroke="#ffe5a6" stroke-width="1.2" stroke-linejoin="round"/><path d="M-12 24L-9 5L0 13L9 5L12 24L0 32Z" fill="#ffe5a6"/><path d="M-7 22L-3 24M7 22L3 24" stroke="#271421" stroke-width="2"/></g></svg>
