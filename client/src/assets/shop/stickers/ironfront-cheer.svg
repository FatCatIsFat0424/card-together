<svg id="still" xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220" role="img" aria-labelledby="title">
  <title id="title">Cheerful propeller plane makes a celebratory flypast</title>
  <style>
    svg:target * { animation: none !important; }
    .float { animation: hover 3.6s ease-in-out infinite; }
    .sway { transform-origin: 110px 160px; animation: sway 4.4s ease-in-out infinite; }
    .glow { animation: glow 3.2s ease-in-out infinite; }
    @keyframes hover { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes sway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
    @keyframes glow { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .float, .sway, .glow { animation: none; } }
  </style>
