      <path d="m69 110 7 4 8-1m13 2 7 4 8-1" fill="none" stroke="#62f2f3"/>
      <path d="m80 76 3-16m-3-3h10" stroke="#fb73d3"/>
      <path d="m60 145-11 10 10 15 21-19m40-4 14 9-9 14-17-16" fill="#476486"/>
