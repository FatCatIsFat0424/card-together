<svg id="still" xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220" role="img" aria-labelledby="title">
  <title id="title">Fox guardian welcomes visitors beneath a torii</title>
  <style>
    svg:target * { animation: none !important; }
    .float { animation: hover 3.6s ease-in-out infinite; }
    .sway { transform-origin: 110px 160px; animation: sway 4.4s ease-in-out infinite; }
    .glow { animation: glow 3.2s ease-in-out infinite; }
