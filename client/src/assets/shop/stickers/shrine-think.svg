    <path d="M39 154 52 160 48 179 38 169Z" fill="#fff1da"/>
    <g class="sway">
      <path d="M69 183 77 137 129 130 146 181Z" fill="#e98c58"/>
      <path d="m67 103 5-41 32 26 33-18 4 42-20 30-37-4Z" fill="#fff1da"/>
      <path d="m77 76 9 29 15-12m32-11-12 24-11-14" fill="#e96e53" stroke="none"/>
      <path d="m86 115 11-2m18 0 10 5m-24 7 5 4 5-3" fill="none" stroke="#713b38"/>
      <path d="m115 157-3-18 14-6 9 17" fill="#fff1da"/>
      <path d="m87 157 5 17" stroke="#713b38"/>
    </g>
    <g class="float">
      <path d="M154 91V57l14-12 14 12V91Z" fill="#fff1da" stroke="#ffce78"/>
      <path d="M168 45V32m-9 29h18m-15 9h12m-6-8v17" stroke="#e96e53"/>
    </g>
    <g class="glow" fill="#ffce78" stroke="none"><circle cx="147" cy="117" r="4"/><circle cx="156" cy="103" r="6"/></g>
  </g>
