<svg id="still" xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><style>svg:target *{animation:none!important}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 24s linear infinite}.pulse{animation:pulse 3.6s ease-in-out infinite}.drift{animation:drift 7s ease-in-out infinite alternate}.scan{animation:scan 6s linear infinite}.flicker{animation:pulse 2.8s ease-in-out infinite alternate}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes drift{to{transform:translate(8px,-5px)}}@keyframes scan{0%{transform:translateX(-30px);opacity:0}25%,75%{opacity:.6}100%{transform:translateX(60px);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07152e"/><stop offset="1" stop-color="#080d1a"/></linearGradient><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#ffdc8b"/><stop offset=".48" stop-color="#43e5ff"/><stop offset="1" stop-color="#ffdc8b"/></linearGradient><radialGradient id="aura"><stop stop-color="#43e5ff" stop-opacity=".3"/><stop offset="1" stop-color="#43e5ff" stop-opacity="0"/></radialGradient></defs><g transform="translate(50 50) scale(1)"><path d="M0-33L12-9L30 8L14 13L10 29L0 21L-10 29L-14 13L-30 8L-12-9Z" fill="url(#metal)" stroke="#ffdc8b" stroke-width="1.2" stroke-linejoin="round"/><path d="M0-22V17M-7 9L0-8L7 9" fill="none" stroke="#ffdc8b" stroke-width="2"/><path class="pulse" d="M-7 28L-4 39L0 32L4 39L7 28" fill="#43e5ff"/></g></svg>
