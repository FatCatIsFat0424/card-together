<svg id="still" xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><style>svg:target *{animation:none!important}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 24s linear infinite}.pulse{animation:pulse 3.6s ease-in-out infinite}.drift{animation:drift 7s ease-in-out infinite alternate}.scan{animation:scan 6s linear infinite}.flicker{animation:pulse 2.8s ease-in-out infinite alternate}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes drift{to{transform:translate(8px,-5px)}}@keyframes scan{0%{transform:translateX(-30px);opacity:0}25%,75%{opacity:.6}100%{transform:translateX(60px);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111b39"/><stop offset="1" stop-color="#080d1a"/></linearGradient><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#b7c9ff"/><stop offset=".48" stop-color="#f3c970"/><stop offset="1" stop-color="#b7c9ff"/></linearGradient><radialGradient id="aura"><stop stop-color="#f3c970" stop-opacity=".3"/><stop offset="1" stop-color="#f3c970" stop-opacity="0"/></radialGradient></defs><g transform="translate(50 50) scale(1)"><path d="M-30-28L-15-11L0-33L15-11L30-28L24 9H-24ZM-24 15H24V25H-24Z" fill="url(#metal)" stroke="#b7c9ff" stroke-width="1.2" stroke-linejoin="round"/><g fill="#111b39"><path d="M0-25L4-17L0-12L-4-17Z"/><circle cx="-17" cy="0" r="3"/><circle cx="17" cy="0" r="3"/><path d="M0-3L4 3L0 8L-4 3Z"/></g></g></svg>
