<svg id="still" xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><style>svg:target *{animation:none!important}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 24s linear infinite}.pulse{animation:pulse 3.6s ease-in-out infinite}.drift{animation:drift 7s ease-in-out infinite alternate}.scan{animation:scan 6s linear infinite}.flicker{animation:pulse 2.8s ease-in-out infinite alternate}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes drift{to{transform:translate(8px,-5px)}}@keyframes scan{0%{transform:translateX(-30px);opacity:0}25%,75%{opacity:.6}100%{transform:translateX(60px);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#161f1c"/><stop offset="1" stop-color="#080d1a"/></linearGradient><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#ffcb76"/><stop offset=".48" stop-color="#b3ce8d"/><stop offset="1" stop-color="#ffcb76"/></linearGradient><radialGradient id="aura"><stop stop-color="#b3ce8d" stop-opacity=".3"/><stop offset="1" stop-color="#b3ce8d" stop-opacity="0"/></radialGradient></defs><g transform="translate(50 50) scale(1)"><path d="M-31 9H31L25 24H-25ZM-21-6H16L25 8H-29ZM-9-19H12L16-7H-14ZM11-16H38V-11H11Z" fill="url(#metal)" stroke="#ffcb76" stroke-width="1.2" stroke-linejoin="round"/><g fill="#161f1c"><circle cx="-18" cy="16" r="4"/><circle cx="-6" cy="16" r="4"/><circle cx="6" cy="16" r="4"/><circle cx="18" cy="16" r="4"/></g></g></svg>
