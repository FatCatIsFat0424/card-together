<svg id="still" xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><style>svg:target *{animation:none!important}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 24s linear infinite}.pulse{animation:pulse 3.6s ease-in-out infinite}.drift{animation:drift 7s ease-in-out infinite alternate}.scan{animation:scan 6s linear infinite}.flicker{animation:pulse 2.8s ease-in-out infinite alternate}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes drift{to{transform:translate(8px,-5px)}}@keyframes scan{0%{transform:translateX(-30px);opacity:0}25%,75%{opacity:.6}100%{transform:translateX(60px);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#160e2b"/><stop offset="1" stop-color="#080d1a"/></linearGradient><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#63f7ed"/><stop offset=".48" stop-color="#ff60d5"/><stop offset="1" stop-color="#63f7ed"/></linearGradient><radialGradient id="aura"><stop stop-color="#ff60d5" stop-opacity=".3"/><stop offset="1" stop-color="#ff60d5" stop-opacity="0"/></radialGradient></defs><g transform="translate(50 50) scale(1)"><path d="M-28-30H9L28-11V30H-9L-28 11ZM-17-19V5L-5 19H17V-5L5-19ZM-9-9H9V9H-9Z" fill="url(#metal)" stroke="#63f7ed" stroke-width="1.2" stroke-linejoin="round"/><path d="M-40-16H-29M-40 0H-29M-40 16H-21M28-16H40M28 0H40M21 16H40" stroke="#63f7ed" stroke-width="2"/><path class="pulse" d="M-5-6H5V6H-5Z" fill="#63f7ed"/></g></svg>
